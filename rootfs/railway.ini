; Railway settings for Shaarli
memory_limit = 128M
post_max_size = 32M
upload_max_filesize = 32M
expose_php = Off
; Sessions live on the volume, so a redeploy doesn't log you out.
session.save_path = "/var/www/shaarli/data/sessions"
session.cookie_httponly = 1
session.cookie_samesite = Lax
; Fixes client IP and HTTPS detection behind Railway's edge (see railway-proxy.php).
auto_prepend_file = /usr/local/share/shaarli/railway-proxy.php
