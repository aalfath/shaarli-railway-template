; Shaarli's upstream pool, sized for a small Railway service (0.5 GB on Free plans).
[global]
daemonize = no
error_log = /proc/self/fd/2
log_limit = 8192

[www]
user = nginx
group = nginx
listen = /var/run/php-fpm.sock
listen.owner = nginx
listen.group = nginx
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
pm = dynamic
pm.max_children = 6
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 1000
